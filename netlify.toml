# ════════════════════════════════════════════════════════
# Netlify config — Óptica Anaka
# ════════════════════════════════════════════════════════

# ── Forzar canonical: apex → www (un solo host para SEO) ──
[[redirects]]
  from = "https://anakaoptica.com/*"
  to = "https://www.anakaoptica.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://anakaoptica.com/*"
  to = "https://www.anakaoptica.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.anakaoptica.com/*"
  to = "https://www.anakaoptica.com/:splat"
  status = 301
  force = true

# ── Redirects para query params de WordPress (crawl budget + Error 5xx) ──
# Netlify _redirects no soporta wildcards en query strings; se usan aquí con conditions

[[redirects]]
  from = "/*"
  to = "/"
  status = 301
  force = false
  [redirects.conditions]
    Query = {page_id = ":id"}

[[redirects]]
  from = "/*"
  to = "/"
  status = 301
  force = false
  [redirects.conditions]
    Query = {pid = ":id"}

# ════════════════════════════════════════════════════════
# Security & SEO headers globales
# ════════════════════════════════════════════════════════

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    # CSP en modo report-only para validar antes de hacerlo blocking
    Content-Security-Policy-Report-Only = "default-src 'self'; img-src 'self' data: https://www.anakaoptica.com; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://script.google.com https://www.google-analytics.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://script.google.com"

# ── Cache largo para assets estáticos (imágenes, fuentes, CSS, JS) ──
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/colecciones/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── HTML: cache corto + revalidación (para que los cambios se vean rápido) ──
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Sitemap y robots: cache de 1 día ──
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
