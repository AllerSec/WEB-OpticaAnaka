# ════════════════════════════════════════════════════════
# Netlify config — Óptica Anaka
# ════════════════════════════════════════════════════════
#
# NOTA: NO añadir redirects manuales apex→www ni http→https.
# Netlify los gestiona automáticamente cuando el "Primary domain"
# está configurado en el panel de Domain Management.
# Intentarlo manualmente causa ERR_TOO_MANY_REDIRECTS
# (ya pasó en commit 2e8ff96, revertido entonces — no repetir).

# Los redirects de query-params WordPress están en _redirects (sintaxis con `!`
# para forzar incluso cuando el destino devuelve 200).

# ════════════════════════════════════════════════════════
# Security & SEO headers globales
# ════════════════════════════════════════════════════════

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    # CSP en modo report-only para validar antes de hacerlo blocking
    Content-Security-Policy-Report-Only = "default-src 'self'; img-src 'self' data: https://anakaoptica.com; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://script.google.com https://www.google-analytics.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://script.google.com"

# ── Cache largo para assets estáticos (imágenes, fuentes, CSS, JS) ──
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/colecciones/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── HTML: cache corto + revalidación (para que los cambios se vean rápido) ──
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Vídeos decorativos: noindex para Google (no son contenido buscable) ──
# Evita el reporte "El vídeo no está en una página de visualización" en GSC.
[[headers]]
  for = "/assets/videos/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# ── Sitemap y robots: cache de 1 día ──
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
